<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KM100 Skills &amp; Training Center — Staff &amp; Access Portal</title>
    <link rel="icon" type="image/png" href="/km100-logo.png" />
    <meta name="description" content="Official Staff Access, Badge Generator &amp; Gate Verification Portal for KM100 Skills and Training Center, Inc." />
    <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('km100_theme_mode');
          if (mode === 'dark' || (!mode && window.matchMedia && !window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.classList.add('dark');
          } else if (mode === 'light') {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
